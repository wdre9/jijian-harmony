name: Build HarmonyOS HAP

# 触发：push main、打 v* 标签、手动触发（对齐 build-android.yml 套路）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libgl1-mesa-dev

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 官方做法：使用 DevEco Command Line Tools（内含 HarmonyOS SDK / Node / hvigor / ohpm）
      # 需在仓库 Secrets 中配置 HARMONY_CLT_URL（华为开发者官网「搭建流水线」页面提供的
      # commandline-tools-linux-x64-*.zip 直链，需登录获取）。
      - name: Download & setup DevEco Command Line Tools
        env:
          CLT_URL: ${{ secrets.HARMONY_CLT_URL }}
        run: |
          if [ -z "$CLT_URL" ]; then
            echo "::error::未配置 Secret HARMONY_CLT_URL。请从华为开发者官网（HarmonyOS 构建应用 - 命令行方式）获取 commandline-tools-linux-x64-*.zip 直链并添加到仓库 Secrets，然后重跑本工作流。"
            exit 1
          fi
          curl -fL "$CLT_URL" -o commandline-tools.zip
          unzip -q commandline-tools.zip -d /opt
          COMMANDLINE_TOOL_DIR=$(ls -d /opt/command-line-tools 2>/dev/null || echo /opt)
          echo "COMMANDLINE_TOOL_DIR=$COMMANDLINE_TOOL_DIR" >> "$GITHUB_ENV"
          echo "NODE_HOME=$COMMANDLINE_TOOL_DIR/tool/node" >> "$GITHUB_ENV"
          echo "HDC_HOME=$COMMANDLINE_TOOL_DIR/sdk/default/openharmony/toolchains" >> "$GITHUB_ENV"

      - name: Configure PATH
        run: |
          echo "$COMMANDLINE_TOOL_DIR/bin" >> "$GITHUB_PATH"
          echo "$COMMANDLINE_TOOL_DIR/tool/node/bin" >> "$GITHUB_PATH"
          echo "$COMMANDLINE_TOOL_DIR/sdk/default/openharmony/toolchains" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          node -v
          hvigorw -v || true
          ohpm -v || true

      # 签名 Secrets 齐全则注入签名配置，缺省构建未签名 HAP
      - name: Inject signing config (optional)
        env:
          HARMONY_P12_BASE64: ${{ secrets.HARMONY_P12_BASE64 }}
          HARMONY_P12_PASSWORD: ${{ secrets.HARMONY_P12_PASSWORD }}
          HARMONY_PROFILE_BASE64: ${{ secrets.HARMONY_PROFILE_BASE64 }}
          HARMONY_CERT_BASE64: ${{ secrets.HARMONY_CERT_BASE64 }}
          HARMONY_ALIAS: ${{ secrets.HARMONY_ALIAS }}
        run: |
          SIGNED=$(node scripts/ci-inject-signing.mjs)
          echo "SIGNED=$SIGNED" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: ohpm install --all

      - name: Build HAP
        run: |
          hvigorw clean --no-daemon || true
          hvigorw assembleHap --mode module -p product=default --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: jijian-harmony-hap
          path: entry/build/default/outputs/default/*.hap

      # tag 触发时发布 Release（未签名时明确标注）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          SIGNED=${SIGNED:-unsigned}
          NOTES="## HarmonyOS 计件 $TAG"
          if [ "$SIGNED" = "signed" ]; then
            NOTES="$NOTES\n\n已使用 GitHub Secrets 签名构建（HARMONY_*）"
          else
            NOTES="$NOTES\n\n⚠️ **未签名 HAP**：未配置签名 Secrets（HARMONY_P12_BASE64 / HARMONY_P12_PASSWORD / HARMONY_PROFILE_BASE64 / HARMONY_CERT_BASE64 / HARMONY_ALIAS）。请使用 DevEco Studio 打开工程配置签名后重新签名安装，或本机用 hap-sign-tool 离线签名。"
          fi
          gh release create "$TAG" entry/build/default/outputs/default/*.hap \
            --title "jijian-harmony $TAG" \
            --notes "$NOTES"
